name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Detekt
        uses: detekt/detekt-action@v1
        with:
          version: '1.23.7'
          args: >
            --input app/src/main/java
            --config .github/detekt.yml
            --report sarif:build/reports/detekt.sarif

      - name: Upload Detekt SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt.sarif
